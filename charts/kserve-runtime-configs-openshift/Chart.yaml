apiVersion: v2
name: kserve-runtime-configs-openshift
description: >-
  The LLMInferenceServiceConfig presets an LLMInferenceService refers to
  through spec.baseRefs. Wraps the upstream kserve-runtime-configs chart and
  enables only the LLM configs, leaving the predictive ClusterServingRuntimes
  off. Ships no workloads and needs no SecurityContextConstraints.
type: application
version: 0.1.0
appVersion: "v0.21.0-rc1"
home: https://kserve.github.io/website/
sources:
  - https://github.com/kserve/kserve
keywords:
  - kserve
  - llminferenceserviceconfig
  - llm-d
  - vllm
  - openshift
maintainers:
  - name: platform-team
dependencies:
  # Upstream chart, vendored byte-identical under charts/. No alias: the name is
  # already lowercase and DNS-safe.
  #
  # Must be the same version as charts/kserve-llmisvc-openshift -- the presets
  # are rendered by the controller's own Go template engine, so a mismatch
  # shows up only when a model is deployed. UPGRADE.md bumps both together.
  - name: kserve-runtime-configs
    version: v0.21.0-rc1
    repository: oci://ghcr.io/kserve/charts
