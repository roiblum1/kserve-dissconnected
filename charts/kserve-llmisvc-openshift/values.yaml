# ---------------------------------------------------------------------------
# kserve-llmisvc-openshift
#
# ONE Argo CD Application points at this directory and gets the whole KServe
# LLMInferenceService stack, ordered by sync waves (README, "Deploying with
# Argo CD"):
#
#   PreSync      SCC RoleBinding               (Helm hook, weight -5)
#   wave -10     CRDs, from crds/              (serving.kserve.io, llm-d.ai)
#   wave   0     llmisvc controller, webhooks, Certificate, ConfigMap, ...
#   wave  10     13 LLMInferenceServiceConfig presets
#
# `openshift:`, `argocd:` and `runtimeConfigs:` are added by this wrapper.
# `kserve-llmisvc-resources:` and `kserve-runtime-configs:` are passed straight
# through to the upstream v0.21.0-rc1 subcharts.
#
# Five upstream values are overridden; each is marked OVERRIDE with the reason.
# Everything else is upstream's own default. See PATCHES.md.
# ---------------------------------------------------------------------------

openshift:
  securityContextConstraints:
    # Required. The upstream controller pod sets `runAsUser: 1000`, and
    # OpenShift's default restricted-v2 SCC is MustRunAsRange: on this cluster
    # the namespace range starts at 1000980000, so 1000 is rejected outright.
    # nonroot-v2 is MustRunAsNonRoot, which accepts any non-zero UID, so it is
    # the least-privilege SCC that admits the pod unmodified.
    #
    # The alternative -- deleting runAsUser so restricted-v2 assigns a UID --
    # would fork the upstream pod spec. Binding an SCC does not.
    enabled: true
    name: nonroot-v2
    bindNamespaceServiceAccounts: true
    extraServiceAccounts: []

  # The llminferenceservices CRD hardcodes its conversion-webhook clientConfig
  # to `namespace: kserve` and its CA injection to `kserve/llmisvc-serving-cert`
  # -- neither is templated by the upstream CRD chart. Installing the controller
  # anywhere else leaves the CRD's conversion webhook pointing at a Service that
  # does not exist, and every read of an LLMInferenceService fails.
  #
  # Set to "" to skip the check if upstream ever templates that namespace.
  enforceNamespace: kserve

# ---------------------------------------------------------------------------
# Argo CD sync waves for what this wrapper renders itself. The CRDs in crds/
# carry wave -10 as a static annotation (Helm never templates crds/), and the
# upstream subchart's resources have no annotation hook, so they sit at 0.
# Only the order matters, not the numbers. Helm ignores all of it.
# ---------------------------------------------------------------------------
argocd:
  syncWave:
    # After wave 0 is HEALTHY -- Argo CD waits for the controller Deployment
    # to be Available, which is when the ValidatingWebhookConfiguration for
    # LLMInferenceServiceConfig finally has endpoints. Any value > 0 works.
    runtimeConfigs: "10"

# The LLMInferenceServiceConfig presets an LLMInferenceService refers to
# through spec.baseRefs (kserve-config-llm-template and friends). Rendered by
# templates/llmisvcconfigs.yaml from the vendored kserve-runtime-configs
# subchart's own file, so they can carry the wave above. Set false only if
# something else on the cluster already provides them in this namespace.
#
# PLAIN HELM (no Argo CD): Helm applies every manifest in one pass, so on a
# FIRST install these are rejected by the webhook described above. Install
# with --set runtimeConfigs.enabled=false --wait, then `helm upgrade` with it
# back on. Argo CD needs none of that.
runtimeConfigs:
  enabled: true

# ---------------------------------------------------------------------------
# Upstream kserve-llmisvc-resources values
# ---------------------------------------------------------------------------
kserve-llmisvc-resources:
  kserve:
    # true is correct here: this release owns the shared inferenceservice-config
    # ConfigMap and the `default` ClusterStorageContainer, because the main
    # kserve-resources chart is not installed. Set false only when adding
    # LLMInferenceService to an existing KServe install.
    createSharedResources: true

    llmisvc:
      # OVERRIDE 1 (upstream: true).
      #
      # true renders four cluster-scoped CRDs into templates/:
      #   inferencepools.inference.networking.k8s.io      Gateway API
      #   inferencepools.inference.networking.x-k8s.io    Inference Extension
      #   inferenceobjectives.llm-d.ai
      #   inferencemodelrewrites.llm-d.ai
      #
      # Because they land in templates/, they would carry no sync wave, no
      # Prune=false/Delete=false, and `helm uninstall` would DELETE them -- and
      # with them every InferencePool on the cluster, including other
      # tenants'. The same four CRDs, rendered from this same chart version by
      # hack/update-crds.sh, ship instead as static files: the two llm-d.ai
      # ones in this chart's crds/, the two InferencePool ones in
      # charts/envoy-gateway-openshift/crds/ (Envoy Gateway watches
      # InferencePool, so it must exist before Envoy Gateway starts).
      createGIECRDs: false

      controller:
        # OVERRIDE 2 (upstream: `kserve/llmisvc-controller`).
        #
        # Fully qualified. An unqualified name is resolved by CRI-O's
        # unqualified-search-registries, so in a disconnected cluster the
        # ImageDigestMirrorSet for docker.io/kserve/* only applies if docker.io
        # happens to still be in that list. Naming the registry removes the
        # dependency on node configuration. The tag stays derived from
        # kserve.version, so a version bump is still a one-line change.
        image: docker.io/kserve/llmisvc-controller

        # OVERRIDE 3 (upstream: Always).
        #
        # Always re-pulls on every pod start. In a disconnected cluster that
        # turns a brief mirror outage into a controller that cannot restart,
        # even though the image is already on the node.
        imagePullPolicy: IfNotPresent

    storage:
      # OVERRIDE 4 (upstream: `kserve/storage-initializer`). Same reason as
      # OVERRIDE 2. This is the image in the `default` ClusterStorageContainer,
      # which fetches model weights.
      image: docker.io/kserve/storage-initializer

    controller:
      gateway:
        ingressGateway:
          # OVERRIDE 5 (upstream: `kserve/kserve-ingress-gateway`).
          #
          # The Gateway that every HTTPRoute the llmisvc controller creates uses
          # as its parentRef, written as <namespace>/<name>. Pointed at the
          # Gateway charts/envoy-ai-gateway-openshift already created, so model
          # traffic reuses the Envoy data plane, Service and Route that are
          # in place rather than standing up a second one.
          #
          # That listener must accept routes from the model's namespace. The AI
          # Gateway chart defaults to `allowedRoutes.namespaces.from: All` for
          # exactly this reason.
          #
          # Set this back to kserve/kserve-ingress-gateway, and create that
          # Gateway yourself, if you would rather KServe own a separate data
          # plane.
          kserveGateway: envoy-ai-gateway-system/envoy-ai-gateway

# ---------------------------------------------------------------------------
# Upstream kserve-runtime-configs values
# ---------------------------------------------------------------------------
kserve-runtime-configs:
  kserve:
    llmisvcConfigs:
      # Upstream default (false), restated because it is load-bearing: this
      # wrapper renders the same presets itself, with a sync wave (see
      # runtimeConfigs above). Turning this on emits every preset twice, at
      # wave 0, and templates/_validate.tpl fails the render.
      enabled: false

    servingruntime:
      # Upstream default. These are the predictive-serving
      # ClusterServingRuntimes -- sklearn, xgboost, triton, tensorflow,
      # huggingface and friends. They belong to InferenceService, not
      # LLMInferenceService, and turning them on would add roughly a dozen
      # more images to mirror-config.yaml for no benefit here.
      enabled: false
