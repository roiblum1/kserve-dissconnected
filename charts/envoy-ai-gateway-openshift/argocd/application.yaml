# ---------------------------------------------------------------------------
# Argo CD Application: Envoy AI Gateway, plus the GatewayClass, Gateway,
# EnvoyProxy and OpenShift Route this wrapper adds.
#
# Sync wave 10: after Envoy Gateway is healthy at wave 0. Inside the
# Application the resources are waved again -- SCC binding -5, EnvoyProxy and
# the controller 0, GatewayClass 1, Gateway 2, Route 3 -- which is what
# replaces the manual `oc rollout restart deployment/envoy-gateway` from the
# Helm install order. See values.yaml, the `argocd:` block, for why.
#
# Before applying: set repoURL, targetRevision and metadata.namespace.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-ai-gateway
  namespace: openshift-gitops          # `argocd` on upstream Argo CD
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/envoy-ai.git
    targetRevision: main
    path: charts/envoy-ai-gateway-openshift
    helm:
      releaseName: envoy-ai-gateway
      skipCrds: true

      valueFiles:
        - values.yaml
        # NOT OPTIONAL with KServe (CLAUDE.md invariant 12): widens the
        # listener to allowedRoutes.namespaces.from: All, without which the
        # HTTPRoutes KServe creates in model namespaces are rejected as
        # NotAllowedByListeners.
        - values-kserve.yaml
        # REQUIRED under Argo CD: makes the render deterministic by letting
        # cert-manager issue the webhook certificate. Read the header of that
        # file before removing it -- without it this Application is
        # permanently OutOfSync and rotates a webhook keypair every sync.
        - values-argocd.yaml
        # On a cluster WITH a load-balancer provider, add this and drop the
        # Route. Check first: oc get infrastructure cluster -o jsonpath='{.status.platform}'
        # - values-loadbalancer.yaml
        # - values-mirror.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system

  syncPolicy:
    automated:
      # Prunes the cluster-scoped GatewayClass too, if it is ever removed from
      # the chart. That is intended -- this stack owns `envoy-ai-gateway` and
      # no other GatewayClass is touched -- but it is the one cluster-wide
      # effect of a sync here, so it is worth knowing about.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      # Generous on purpose. The Gateway at wave 2 only reports
      # Programmed=True once Envoy Gateway has accepted it and materialised
      # the data plane, which takes longer than one sync attempt on a cold
      # cluster.
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # cert-manager injects the CA bundle, via the inject-ca-from annotation
    # that values-argocd.yaml turns on.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
