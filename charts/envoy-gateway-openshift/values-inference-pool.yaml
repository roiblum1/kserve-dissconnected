# ---------------------------------------------------------------------------
# InferencePool add-on for envoy-gateway-openshift.
#
# REQUIRED whenever KServe's LLMInferenceService is installed. Without it Envoy
# Gateway does not recognise InferencePool as a backendRef kind, so the
# HTTPRoutes the llmisvc controller creates resolve to nothing and the Gateway
# reports ResolvedRefs=False.
#
#   helm upgrade -i envoy-gateway charts/envoy-gateway-openshift \
#     -n envoy-gateway-system --create-namespace \
#     -f charts/envoy-gateway-openshift/values-inference-pool.yaml
#
# This is upstream's own add-on file, re-keyed under `envoy-gateway:` for the
# subchart. Diff it on every version bump against
#   https://raw.githubusercontent.com/envoyproxy/ai-gateway/<AIGW_VERSION>/examples/inference-pool/envoy-gateway-values-addon.yaml
#
# It is a separate file rather than a default in values.yaml for two reasons:
#   * it is upstream's shape, so it stays trivially diffable; and
#   * declaring a backendResource whose CRD is absent makes the Envoy Gateway
#     controller log a failed watch on every reconcile, so an Envoy-only
#     install without the Gateway API Inference Extension CRDs should not carry
#     it. hack/install-crds.sh installs those CRDs.
#
# Helm deep-merges maps, so this adds backendResources alongside the
# extensionManager hooks and service already set in values.yaml -- it does not
# replace them. Remember that `helm upgrade` does not remember -f flags: pass
# values.yaml's siblings on every upgrade, or the extensionManager block
# reverts.
# ---------------------------------------------------------------------------
envoy-gateway:
  config:
    envoyGateway:
      extensionManager:
        backendResources:
          - group: inference.networking.k8s.io
            kind: InferencePool
            version: v1
