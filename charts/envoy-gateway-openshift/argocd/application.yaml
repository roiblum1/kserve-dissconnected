# ---------------------------------------------------------------------------
# Argo CD Application: Envoy Gateway control plane.
#
# Sync wave 0. Depends on the CRD Application at wave -10.
#
# Before applying: set repoURL, targetRevision and metadata.namespace.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: openshift-gitops          # `argocd` on upstream Argo CD
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/envoy-ai.git
    targetRevision: main
    path: charts/envoy-gateway-openshift
    helm:
      # Pinned, not left to default to the Application name: the wrapper's SCC
      # RoleBinding is named after the release, so this is what makes the
      # rendered object set identical to the documented `helm install
      # envoy-gateway ...`. An existing Helm release can be handed over to
      # Argo CD without anything being renamed or recreated.
      releaseName: envoy-gateway

      # CLAUDE.md invariant 6: CRDs never come from a chart. Argo CD renders
      # with --include-crds by default, so this has to be said explicitly even
      # though `crds.enabled: false` already skips the crds subchart -- the
      # same belt-and-braces as the documented `--skip-crds`.
      skipCrds: true

      valueFiles:
        - values.yaml
        # NOT OPTIONAL with KServe (CLAUDE.md invariant 12). Without it Envoy
        # Gateway rejects the InferencePool backendRef and answers every model
        # route with a 500 direct response. Unlike `helm upgrade -f`, which is
        # forgotten on the next upgrade, this is declarative and cannot be lost.
        - values-inference-pool.yaml
        # Disconnected registries without a cluster-wide ImageDigestMirrorSet:
        # - values-mirror.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Matches how Helm 4 applies (field manager helm/Apply), and lets the
      # certgen Job keep the webhook caBundle it patches in.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m

  # No ignoreDifferences needed here. Everything certgen mutates -- the
  # topology-injector MutatingWebhookConfiguration and the `envoy-gateway`
  # Secret -- is either a Helm hook, which Argo CD applies but never diffs, or
  # not rendered by the chart at all. The Envoy data-plane Deployment, Service
  # and ServiceAccount that Envoy Gateway generates in this namespace carry no
  # Argo CD tracking label, so they are never pruned; if the AppProject has
  # orphaned-resource monitoring on, expect them to be listed as orphans.
