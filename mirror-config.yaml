# oc-mirror v2 image set for the whole stack. Usage: README, "Disconnected".
# Keep in sync with the charts: hack/list-images.sh --check
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels: []

  # Prerequisite. Delete if the cluster already has cert-manager.
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      packages:
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1

  additionalImages:
    # Envoy Gateway v1.9.1
    - name: docker.io/envoyproxy/gateway:v1.9.1
    - name: docker.io/envoyproxy/envoy:distroless-v1.39.1
    - name: docker.io/envoyproxy/ratelimit:8fe6ea42

    # Envoy AI Gateway v1.1.0
    - name: docker.io/envoyproxy/ai-gateway-controller:v1.1.0
    - name: docker.io/envoyproxy/ai-gateway-extproc:v1.1.0

    # LeaderWorkerSet v0.10.0
    - name: registry.k8s.io/lws/lws:v0.10.0

    # KServe v0.21.0
    - name: docker.io/kserve/llmisvc-controller:v0.21.0-rc1
    - name: docker.io/kserve/storage-initializer:v0.21.0-rc1

    # KServe runtime presets (hardcoded upstream; only the IDMS redirects them)
    - name: ghcr.io/llm-d/llm-d-cuda:v0.9.0
    - name: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0
    - name: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
    - name: ghcr.io/llm-d/llm-d-latency-predictor-prediction-server:0.9.0
    - name: ghcr.io/llm-d/llm-d-latency-predictor-training-server:0.9.0
    - name: docker.io/vllm/vllm-openai-cpu:v0.23.0
