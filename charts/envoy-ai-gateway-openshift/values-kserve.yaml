# ---------------------------------------------------------------------------
# KServe overlay for envoy-ai-gateway-openshift.
#
# REQUIRED whenever KServe's LLMInferenceService shares this Gateway.
#
#   helm upgrade -i envoy-ai-gateway charts/envoy-ai-gateway-openshift \
#     -n envoy-ai-gateway-system --create-namespace \
#     -f charts/envoy-ai-gateway-openshift/values-kserve.yaml
#
# The llmisvc controller creates one HTTPRoute per LLMInferenceService, in the
# model's own namespace, with this Gateway as its parentRef. The chart's
# default listener only accepts routes from its own namespace, so those routes
# would be rejected with NotAllowedByListeners and the model would never be
# reachable.
#
# `All` is the same setting KServe's own dependency installer uses for the
# Gateway it creates. If you would rather enumerate the model namespaces,
# replace it with a selector -- the whole allowedRoutes block is passed through
# verbatim:
#
#   allowedRoutes:
#     namespaces:
#       from: Selector
#       selector:
#         matchLabels:
#           kserve.io/inference: "true"
#
# Remember that `helm upgrade` does not remember -f flags. If you also use
# values-loadbalancer.yaml or values-mirror.yaml, pass all of them every time.
# ---------------------------------------------------------------------------
gateway:
  listener:
    allowedRoutes:
      namespaces:
        from: All
