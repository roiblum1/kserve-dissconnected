# ---------------------------------------------------------------------------
# kserve-runtime-configs-openshift
#
# `kserve-runtime-configs:` is passed straight through to the upstream
# kserve-runtime-configs v0.21.0-rc1 subchart.
#
# ONE upstream value is overridden. Nothing else -- no images, no security
# contexts, no OpenShift additions: this chart creates 13
# LLMInferenceServiceConfig objects and no pods.
# ---------------------------------------------------------------------------
kserve-runtime-configs:
  kserve:
    llmisvcConfigs:
      # OVERRIDE 1 (upstream: false). The only reason this chart exists.
      # Renders the 13 LLMInferenceServiceConfig presets that
      # LLMInferenceService.spec.baseRefs resolves against.
      enabled: true

    servingruntime:
      # Left at upstream's default. These are the predictive-serving
      # ClusterServingRuntimes -- sklearn, xgboost, triton, tensorflow,
      # huggingface and friends. They belong to InferenceService, not
      # LLMInferenceService, and turning them on would add roughly a dozen
      # more images to mirror-config.yaml for no benefit here.
      enabled: false
