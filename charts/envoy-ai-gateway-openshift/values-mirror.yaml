# ---------------------------------------------------------------------------
# Disconnected / mirrored-registry overlay for envoy-ai-gateway-openshift.
#
#   helm install envoy-ai-gateway charts/envoy-ai-gateway-openshift \
#     -n envoy-ai-gateway-system --create-namespace \
#     -f charts/envoy-ai-gateway-openshift/values.yaml \
#     -f charts/envoy-ai-gateway-openshift/values-mirror.yaml
#
# Replace REGISTRY.EXAMPLE.COM/envoyproxy with your mirror.
#
# The controller passes --extProcImage to Envoy Gateway, which injects that
# reference into the Envoy data-plane pods. It must therefore be resolvable from
# the Envoy Gateway namespace too, not just from this one.
# ---------------------------------------------------------------------------
ai-gateway:
  # If your mirror needs credentials, uncomment the WHOLE block below -- the
  # `global:` key included. A key with nothing but comments under it parses as
  # null and overrides the subchart's own `global.imagePullSecrets: []` with
  # nil, which fails the render with:
  #   nil pointer evaluating interface {}.imagePullSecrets
  #
  # The secret must exist in both this namespace and the Envoy Gateway
  # namespace, because the ext_proc sidecar is pulled by the data-plane pods.
  #
  # global:
  #   imagePullSecrets:
  #     - name: mirror-pull-secret

  controller:
    image:
      repository: REGISTRY.EXAMPLE.COM/envoyproxy/ai-gateway-controller
      tag: v1.1.0

  extProc:
    image:
      repository: REGISTRY.EXAMPLE.COM/envoyproxy/ai-gateway-extproc
      tag: v1.1.0
