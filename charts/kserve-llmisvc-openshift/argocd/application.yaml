# ---------------------------------------------------------------------------
# Argo CD Application: KServe's LLMInferenceService controller.
#
# Sync wave 20: after the Gateway exists at wave 10, because the controller is
# configured with kserveGateway=envoy-ai-gateway-system/envoy-ai-gateway and
# attaches the HTTPRoutes it generates to it.
#
# PREREQUISITE, not managed here: cert-manager. This chart creates a
# cert-manager Certificate and Issuer for its webhook, and the
# llminferenceservices CRD carries `cert-manager.io/inject-ca-from`. Without
# cert-manager the controller never goes Ready and every read of an
# LLMInferenceService fails. On OpenShift, install the cert-manager Operator
# for Red Hat OpenShift first, or add it as an Application at a wave below -10.
#
# Before applying: set repoURL, targetRevision and metadata.namespace.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-llmisvc
  namespace: openshift-gitops          # `argocd` on upstream Argo CD
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/envoy-ai.git
    targetRevision: main
    path: charts/kserve-llmisvc-openshift
    helm:
      releaseName: kserve-llmisvc
      skipCrds: true
      valueFiles:
        - values.yaml
        # - values-mirror.yaml

  destination:
    server: https://kubernetes.default.svc
    # MUST be `kserve` (CLAUDE.md invariant 10). The upstream
    # llminferenceservices CRD hardcodes its conversion webhook's Service
    # namespace and its cert-manager CA source to `kserve`, and neither is
    # templated. Anywhere else, the CRD points at a Service that does not
    # exist. The chart fails its own render rather than let this happen, so a
    # wrong namespace here surfaces as a ComparisonError, not a broken cluster.
    namespace: kserve

  syncPolicy:
    automated:
      # Prunes the cluster-scoped `default` ClusterStorageContainer if it is
      # removed from the chart. This stack owns it; check with
      # `oc get clusterstoragecontainer` before assuming nothing else does.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # All three webhook configurations carry
    # `cert-manager.io/inject-ca-from: kserve/llmisvc-serving-cert`, so
    # cert-manager owns their caBundle and rewrites it on every rotation.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
