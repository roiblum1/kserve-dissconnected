# Deliberate deviations between what the charts reference and what
# mirror-config.yaml mirrors. Read by hack/list-images.sh --check.
#
# Without this file the two must match exactly, which is what keeps the mirror
# list honest after a version bump. Editing mirror-config.yaml by hand instead
# would make --check fail permanently, and a gate that always fails is a gate
# nobody reads. Every entry here is a claim that a mismatch is intentional --
# and --check still fails if the charts move to a reference that is neither
# mirrored nor listed below.
#
# `replace` maps a chart-referenced image to what is mirrored in its place.
# Both sides are compared on repo:tag, ignoring any digest.
replace:
  # Locally built vLLM/llm-d image. The upstream reference is a literal inside
  # the presets (files/llmisvcconfigs/resources.yaml), so no Helm value reaches
  # it -- and because the substitute has a different repo AND tag, no
  # ImageTagMirrorSet reaches it either: an ITMS rewrites the registry/repo but
  # keeps the tag. Set it per model on the LLMInferenceService instead.
  ghcr.io/llm-d/llm-d-cuda:v0.9.0: docker.io/roi12345/vllm-llmd:0.30.0-r1

# `extra` is mirrored although no chart references it.
extra:
  # NVIDIA DOCA/OFED driver, a node-level prerequisite for the RDMA fabric
  # multi-node (tensor/pipeline-parallel) serving needs. Delivered by the
  # NVIDIA Network Operator, which is outside this repo.
  - docker.io/roi12345/doca-ofed-driver:doca3.5.0-26.07-0.7.7.0-0-5.14.0-687.44.1.el9_8.x86_64-rhel9.8-amd64
