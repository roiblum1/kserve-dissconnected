# ---------------------------------------------------------------------------
# Argo CD Application: the CRDs this stack owns.
#
# Sync wave -10: every other Application in this repo creates custom resources
# of these kinds, so they have to exist first.
#
# This directory is what `hack/install-crds.sh --emit crds` writes. Argo CD
# cannot run that script, so the CRDs have to exist as manifests in git; the
# script stays the imperative path for a non-GitOps install and both use the
# same code, so they cannot drift. Regenerate after every version bump --
# `helm upgrade` never touches CRDs and neither does an Argo CD sync of the
# five chart Applications, because CRDs are deliberately kept out of them
# (CLAUDE.md invariant 6).
#
# Gateway API (gateway.networking.k8s.io) is NOT here and must never be: those
# CRDs belong to the cluster-ingress-operator on OpenShift. The emitter asserts
# it (CLAUDE.md invariant 2).
#
# Before applying: set repoURL, targetRevision and metadata.namespace.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-ai-crds
  # Where Argo CD runs. `openshift-gitops` is the OpenShift GitOps operator's
  # default; upstream Argo CD uses `argocd`.
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  # No `resources-finalizer.argocd.argoproj.io` on purpose. With it, deleting
  # this Application would delete all 24 CRDs and, with them, every custom
  # resource of those kinds on the cluster -- including any InferencePool
  # another product on the cluster may own. Deleting the Application without
  # the finalizer leaves the CRDs in place, which is the whole reason they are
  # not in the charts. Use `argocd app delete --cascade` if you truly mean it.
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/envoy-ai.git
    targetRevision: main
    path: crds
    directory:
      # Must stay false: it keeps this very file out of the Application's own
      # manifest set. With recurse=true Argo CD would find crds/argocd/ and try
      # to manage the Application from inside itself.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    # No namespace: every object here is cluster-scoped.

  syncPolicy:
    automated:
      # PRUNE MUST STAY FALSE. A CRD deleted from git is a CRD deleted from the
      # cluster, and Kubernetes garbage-collects every custom resource of that
      # kind with it -- across all namespaces, for all tenants. Removing a CRD
      # is a deliberate, manual act; see README, "Uninstall".
      prune: false
      selfHeal: true
    syncOptions:
      # MANDATORY. llminferenceservices.serving.kserve.io renders to ~5 MB and
      # the CRDs total ~12 MB. Client-side apply stores the manifest in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which is
      # capped at 262144 bytes, so a client-side sync fails outright with
      # "metadata.annotations: Too long".
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # cert-manager writes the CA bundle into the conversion webhook of
    # llminferenceservices and llminferenceserviceconfigs, which carry
    # `cert-manager.io/inject-ca-from: kserve/llmisvc-serving-cert`. Without
    # this the Application is permanently OutOfSync, and with selfHeal on,
    # Argo CD and cert-manager overwrite each other on every cert rotation.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
