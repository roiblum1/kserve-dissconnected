{{- if .Values.route.direct }}
{{- $name := .Values.model.name -}}
{{- $viaScheduler := eq .Values.route.through "scheduler" -}}
# Where the gateway sends the model's requests.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: Endpoints
  endpoints:
  - fqdn:
      {{- if $viaScheduler }}
      hostname: {{ .Values.gateway.serviceHost }}
      port: {{ .Values.gateway.servicePort }}
      {{- else }}
      hostname: {{ $name }}-kserve-workload-svc.{{ .Release.Namespace }}.svc.cluster.local
      port: 8000
      {{- end }}
---
# The object a QuotaPolicy targets. aigw-ui finds it through the route below.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: {{ $name }}
  # A client must not set the cached-token count of its own answer.
  bodyMutation:
    remove: ["kv_transfer_params"]
  {{- if $viaScheduler }}
  # KServe's route to the scheduler matches on this header.
  headerMutation:
    set:
    - name: X-Gateway-Model-Name
      value: publishers/{{ .Release.Namespace }}/models/{{ $name }}
  {{- end }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
    {{- with .Values.gateway.clientListener }}
    sectionName: {{ . }}
    {{- end }}
  rules:
  - matches:
    - headers:
      - type: Exact
        name: x-ai-eg-model
        value: {{ $name }}
    backendRefs:
    - name: {{ $name }}
    timeouts:
      request: {{ .Values.route.timeout }}
    modelsOwnedBy: {{ .Release.Namespace }}
{{- end }}
