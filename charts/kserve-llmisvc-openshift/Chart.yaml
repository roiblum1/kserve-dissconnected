apiVersion: v2
name: kserve-llmisvc-openshift
description: >-
  KServe's LLMInferenceService stack packaged for OpenShift and Argo CD: the
  controller (upstream kserve-llmisvc-resources), the LLMInferenceServiceConfig
  presets (upstream kserve-runtime-configs), the CRDs both need, and the
  SecurityContextConstraints binding the controller needs. Point one Argo CD
  Application at this directory; sync waves order everything inside it.
type: application
version: 0.1.0
appVersion: "v0.21.0-rc1"
home: https://kserve.github.io/website/
sources:
  - https://github.com/kserve/kserve
keywords:
  - kserve
  - llminferenceservice
  - llm-d
  - generative-ai
  - openshift
maintainers:
  - name: platform-team
dependencies:
  # Upstream chart, vendored byte-identical under charts/. Already lowercase and
  # DNS-safe, so no alias: `.Chart.Name` stays at upstream's value, and with it
  # app.kubernetes.io/name, which is part of the immutable Deployment selector.
  #
  # v0.21.0-rc1 IS KServe v0.21.0. The v0.21.0 GitHub release ships its chart
  # tarballs still labelled -rc1 and ghcr.io has no v0.21.0 tag at all; the
  # -rc1 artifacts on ghcr.io are byte-identical to the ones attached to the
  # v0.21.0 release. See UPGRADE.md, "KServe version labels".
  - name: kserve-llmisvc-resources
    version: v0.21.0-rc1
    repository: oci://ghcr.io/kserve/charts

  # Upstream chart, vendored byte-identical under charts/. Used ONLY as the
  # source of files/llmisvcconfigs/resources.yaml: its own template is disabled
  # (llmisvcConfigs.enabled: false) and templates/llmisvcconfigs.yaml renders the
  # same presets with a later sync wave, reading the file through .Subcharts.
  # See that template for why. Same version as the controller, always.
  - name: kserve-runtime-configs
    version: v0.21.0-rc1
    repository: oci://ghcr.io/kserve/charts
