{{- if and .Values.gateway.enabled .Values.gateway.health.enabled }}
{{- $gwNs := include "envoy-ai-gateway-openshift.gatewayNamespace" . }}
{{- $wave := dig "syncWave" dict (.Values.argocd | default dict) }}
{{- $name := printf "%s-health" .Values.gateway.name }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ $name }}
  namespace: {{ $gwNs }}
  {{- include "envoy-ai-gateway-openshift.annotations" (dict "wave" $wave.gateway) | nindent 2 }}
  labels:
    {{- include "envoy-ai-gateway-openshift.labels" . | nindent 4 }}
spec:
  directResponse:
    statusCode: 200
    contentType: text/plain
    body:
      type: Inline
      inline: ok
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $gwNs }}
  {{- include "envoy-ai-gateway-openshift.annotations" (dict "wave" $wave.clientTrafficPolicy) | nindent 2 }}
  labels:
    {{- include "envoy-ai-gateway-openshift.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.listener.name }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.gateway.health.path }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ $name }}
---
#
# aigw-ui's key check covers the whole listener. A policy on a route takes
# its place for that route, and this one asks for nothing.
#
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $gwNs }}
  {{- include "envoy-ai-gateway-openshift.annotations" (dict "wave" $wave.clientTrafficPolicy) | nindent 2 }}
  labels:
    {{- include "envoy-ai-gateway-openshift.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  authorization:
    defaultAction: Allow
{{- end }}
